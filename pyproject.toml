[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "farialimer"
version = "0.2.0"
authors = [
    { name = "Leandro Meili", email = "leandro.meili@gmail.com" },
]
description = "Parser and Generator for Brazilian Finance Documents. Ex: IMBARQ, CNAB"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["parser", "imbarq", "cnab"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["PyYAML"]

[project.urls]
repository = "https://github.com/redlotus-dev/farialimer"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E203", "E226", "E302", "E401"]

[tool.ruff.lint.mccabe]
max-complexity = 10

